# config/settings.yaml — پیکربندی اصلی ربات سیگنال‌دهی QuantPulse (مخصوص اجرا در GitHub Actions)
scan:
  top_n: 150
  min_24h_volume_usd: 5000000
  include_dollar_gold_daily: true
  candle_staleness_guard_minutes: 75

signals:
  min_score_telegram: 72
  min_score_dashboard: 50
  max_open: 5
  max_new_per_day: 6
  target_before_entry_invalidation: true

risk:
  risk_per_trade_pct: 1.0
  max_directional_portfolio_heat_pct: 3.0
  reference_equity_usd: 1500
  reference_equity_irt: 103800000
  max_leverage: 3
  liquidation_buffer: 1.5
  cooldown_same_direction_hours: 12
  cooldown_after_sl_hours: 24
  max_fee_to_tp1_pct: 20.0
  btc_shock_1h_threshold_pct: 1.8

learning:
  min_trades_calibration: 100
  challenger_min_weeks: 4
  challenger_min_trades: 60
  circuit_breaker_max_consecutive_losses: 8
  auto_promote: false

export:
  include_params: false

telegram:
  send_shadow: false
  timezone: Asia/Tehran
