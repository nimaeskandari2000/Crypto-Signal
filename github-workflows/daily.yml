name: Daily 08:00 Tehran Dollar, Gold & Crypto Report

on:
  schedule:
    # ساعت ۰۸:۰۰ صبح به وقت تهران (۰۴:۳۰ UTC)
    - cron: '30 4 * * *'
  workflow_dispatch:

concurrency:
  group: quantpulse-daily
  cancel-in-progress: false

jobs:
  daily_report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (Public npm + ZIP-friendly)
        run: npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund

      - name: Send Daily Dollar, Gold & Crypto Report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run daily
