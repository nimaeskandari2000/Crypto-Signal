name: 15-Minute Market Scan, Locked Signal Monitor & GitHub Pages Deploy

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'public/data/bot_state.json'
      - 'data/journal/**'
  schedule:
    # اجرای خودکار هر ۱۵ دقیقه برای پایش قیمت‌های زنده، شکارچی پامپ و سیگنال‌های قفل‌شده
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: quantpulse-scan
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (ZIP-friendly without requiring package-lock.json)
        run: npm install --no-audit --no-fund

      - name: Run Quantitative Unit Tests
        run: npm run test

      - name: Execute Live Crypto, Wallex, Bitpin, Pump Hunter, Forex & Gold Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run scan

      - name: Commit updated state & journal back to repo
        run: |
          git config user.name "QuantPulse Bot"
          git config user.email "bot@quantpulse.local"
          git add public/data/bot_state.json data/journal/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): live market scan snapshot [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push || true
          fi

      - name: Build static Management Console for GitHub Pages
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
